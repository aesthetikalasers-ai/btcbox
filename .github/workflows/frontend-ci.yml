name: BTCBOX frontend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - name: Verify all locale dictionaries
        run: npm run check:i18n
      - name: Verify exact decimal estimates
        run: node --experimental-strip-types --test tests/decimal.test.ts tests/kline-data.test.ts
      - run: npm run build
