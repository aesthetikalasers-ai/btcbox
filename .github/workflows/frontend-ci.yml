name: BTCBOX frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
      - "feature/btcbox-complete-redesign"
      - "feature/btcbox-react-frontend-20261104"
      - "feat/btcbox-web3-auth-20261105"
      - "fix/post-merge-db-bootstrap-seconds-20261106"
      - "work/btcbox-unified-20261104"
      - "fix/remove-customer-demo-ledger-20261122"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - name: Verify all locale dictionaries
        run: npm run check:i18n
      - name: Verify exact decimal estimates
        run: node --experimental-strip-types --test tests/decimal.test.ts
      - run: npm run build

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Chromium for isolated browser tests
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload responsive visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcbox-responsive-visual-qa-${{ matrix.shard }}
          path: |
            frontend/test-results/visual-qa/**/*.png
            frontend/test-results/i18n-visual-qa/**/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Playwright failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: btcbox-playwright-failures-${{ matrix.shard }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7
