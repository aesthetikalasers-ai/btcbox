name: BTCBOX frontend CI
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main, "feature/btcbox-react-frontend-20261104", "feat/btcbox-web3-auth-20261105", "fix/post-merge-db-bootstrap-seconds-20261106", "work/btcbox-unified-20261104"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium for isolated browser tests
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile route smoke tests
        run: npm run test:e2e
