name: BTCBOX frontend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "docs/BTCBOX-UI-VISUAL-STANDARDS-V1.md"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "docs/BTCBOX-UI-VISUAL-STANDARDS-V1.md"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - name: Verify all locale dictionaries
        run: npm run check:i18n
      - name: Verify the UI visual standard matches the code
        run: npm run check:visual
      - name: Verify exact decimal estimates
        run: node --experimental-strip-types --test tests/decimal.test.ts tests/kline-data.test.ts
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify critical SPA routes on the production bundle
        run: npm run test:e2e -- --grep "@routing|responsive visual QA /(home|markets|trade/BTCUSDT|trade-hub|assets|funds|deposit|withdraw|convert|me|settings|support|orders|earn|kyc|rewards|address-book|fund-password|contract|seconds) at V1.0 widths|continuous responsive sweep /(home|markets|trade/BTCUSDT|trade-hub|assets|funds|deposit|withdraw|convert|contract)|account and home navigation preserve safe return destinations|order history progressive rendering works on mobile and desktop|independent deposit, withdrawal, and conversion workflows render usable states|withdrawal asset switch refreshes network, saved addresses, balance and fee|assets list can scroll its final row fully above the fixed mobile navigation|trade interaction QA|degraded public catalogue|perpetual form controls and empty states keep their primitive styles|perpetual desktop depth renders eight levels and hands prices to the order form|perpetual mobile depth remains six levels without changing the compact workspace|login route exposes BTCBOX username/email, Google and wallet sign-in|email and password login remains available through Supabase Auth|Google sign-in button is shown when the public auth config enables Google|auth client config failure disables provider sign-in actions|wallet sign-in failures remain visible and never create a BTCBOX session without a wallet provider|registration route offers Google and wallet identity creation|registration keeps Supabase email signup alongside Google and wallet|email registration uses Supabase confirmation and does not bypass BTCBOX provisioning|confirmed email registration exchanges the Supabase identity and provisions the BTCBOX account|email signup explains Supabase confirmation rate limits without weakening protection|email password recovery sends a Supabase reset request|valid BTCBOX session cookie restores the account when Supabase Auth config is unavailable|account page waits for session restoration before showing sign-in|username login submits BTCBOX credentials to the username endpoint and surfaces rejection|provider-authenticated users enter BTCBOX without forced username or password setup|OAuth callback cancellation returns a visible recovery path without creating a BTCBOX session|OAuth callback failure returns a registration attempt to the registration entry|registration experience stays clear and usable on a narrow mobile viewport|registration layout adapts from mobile to desktop without losing the identity choices|Google and Wallet provider entries have matching dimensions and responsive layout|homepage authentication opens an in-place dialog and mode switches stay inside it"
      - name: Upload mobile responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcbox-mobile-responsive-qa
          path: frontend/test-results/visual-qa/**/*.png
          if-no-files-found: ignore
          retention-days: 7
