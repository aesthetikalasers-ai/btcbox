name: BTCBOX frontend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - name: Verify all locale dictionaries
        run: npm run check:i18n
      - name: Verify exact decimal estimates
        run: node --experimental-strip-types --test tests/decimal.test.ts tests/kline-data.test.ts
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify critical SPA routes on the production bundle
        run: npm run test:e2e -- --grep "@routing|responsive visual QA /(home|markets|trade/BTCUSDT|assets|funds|deposit|withdraw|me|contract) at V1.0 widths|continuous responsive sweep /(home|markets|trade/BTCUSDT|assets|funds|deposit|withdraw)|trade interaction QA|degraded public catalogue"
      - name: Upload mobile responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcbox-mobile-responsive-qa
          path: frontend/test-results/visual-qa/**/*.png
          if-no-files-found: ignore
          retention-days: 7
