name: BTCBOX frontend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "docs/BTCBOX-UI-VISUAL-STANDARDS-V1.md"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "docs/BTCBOX-UI-VISUAL-STANDARDS-V1.md"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - name: Verify all locale dictionaries
        run: npm run check:i18n
      - name: Verify the UI visual standard matches the code
        run: npm run check:visual
      - name: Verify exact decimal estimates
        run: node --experimental-strip-types --test tests/decimal.test.ts tests/kline-data.test.ts
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify critical SPA routes on the production bundle
        run: npm run test:e2e -- --grep "@routing|responsive visual QA /(home|markets|trade/BTCUSDT|trade-hub|assets|funds|deposit|withdraw|convert|me|settings|support|orders|earn|kyc|rewards|address-book|fund-password|contract|seconds) at V1.0 widths|continuous responsive sweep /(home|markets|trade/BTCUSDT|trade-hub|assets|funds|deposit|withdraw|convert|contract)|account and home navigation preserve safe return destinations|order history progressive rendering works on mobile and desktop|independent deposit, withdrawal, and conversion workflows render usable states|withdrawal asset switch refreshes network, saved addresses, balance and fee|assets list can scroll its final row fully above the fixed mobile navigation|trade interaction QA|degraded public catalogue|perpetual form controls and empty states keep their primitive styles|perpetual desktop depth renders eight levels and hands prices to the order form|perpetual mobile depth remains six levels without changing the compact workspace"
      - name: Upload mobile responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcbox-mobile-responsive-qa
          path: frontend/test-results/visual-qa/**/*.png
          if-no-files-found: ignore
          retention-days: 7
