name: BTCBOX frontend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - name: Verify all locale dictionaries
        run: npm run check:i18n
      - name: Verify exact decimal estimates
        run: node --experimental-strip-types --test tests/decimal.test.ts tests/kline-data.test.ts
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify authentication, registration and recovery flows
        run: npm run test:e2e -- --grep 'login route exposes|email and password login|email authentication errors show safe translated copy|BTCBOX session provisioning errors|Google sign-in|wallet sign-in failures|registration route offers|registration keeps Supabase email signup|email registration uses Supabase confirmation|confirmed email registration|email signup explains Supabase confirmation rate limits|email password recovery sends|Google-linked Supabase identity|OAuth callback cancellation|OAuth callback failure|provider-authenticated users|registration experience stays clear|registration layout adapts|Google and Wallet provider entries|language preference updates the document locale|first-time visitor sees Japanese|login screen switches to native Japanese copy|homepage authentication opens an in-place dialog'
      - name: Verify critical SPA routes on the production bundle
        run: npm run test:e2e -- --grep "@routing|responsive visual QA /(home|markets|trade/BTCUSDT|assets|me|contract) at V1.0 widths|continuous responsive sweep /(home|markets|trade/BTCUSDT|assets)|trade interaction QA|degraded public catalogue"
      - name: Upload mobile responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcbox-mobile-responsive-qa
          path: frontend/test-results/visual-qa/**/*.png
          if-no-files-found: ignore
          retention-days: 7
