name: BTCBOX Change Guard

on:
  pull_request:
  push:
    branches:
      - working
      - main

permissions:
  contents: read

concurrency:
  group: btcbox-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Identify changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/changed-files.txt
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "$PUSH_BEFORE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          else
            git ls-tree -r --name-only "$HEAD_SHA" > /tmp/changed-files.txt
          fi
          cat /tmp/changed-files.txt

          if grep -Eq '^(backend/|frontend/|\.github/workflows/)' /tmp/changed-files.txt; then
            echo "run_app_checks=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_app_checks=false" >> "$GITHUB_OUTPUT"
          fi

      # smoke.test.js executes backend/scripts/build-site.js, which requires the
      # Vite output in frontend/dist, so the build must run before the tests.
      - name: Install backend dependencies
        if: steps.changes.outputs.run_app_checks == 'true'
        run: npm ci --prefix backend

      - name: Build the Vite frontend and assemble the public site
        if: steps.changes.outputs.run_app_checks == 'true'
        run: npm run build --prefix backend

      - name: Run backend unit tests
        if: steps.changes.outputs.run_app_checks == 'true'
        run: npm test --prefix backend

      - name: Validate frontend translations
        if: steps.changes.outputs.run_app_checks == 'true'
        run: npm run check:i18n --prefix frontend
