name: Change Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files impact
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          echo "=== 改动文件列表 ==="
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true
          else
            git diff --name-only HEAD~1 HEAD || true
          fi

          echo "=== 重点关注区域检查 ==="
          git diff --name-only HEAD~1 HEAD | grep -E '^(backend|frontend|migrations|\.github/workflows)/' || echo "未命中核心目录"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run root checks if present
        run: |
          if [ -f package.json ]; then
            npm ci
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
              npm test
            else
              echo "根目录 package.json 未配置 test 脚本，跳过"
            fi
          else
            echo "根目录无 package.json，跳过"
          fi
