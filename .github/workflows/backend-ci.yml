import React, { useState } from "react";
import { Link, useNavigate } from "react-router-dom";
import { useI18n } from "../../lib/i18n";
import { Button } from "../ui/Button";
import { Card, CardHeader, CardTitle, CardContent, CardFooter } from "../ui/Card";
import { Lock, Mail, ArrowRight } from "lucide-react";

interface AuthPagesProps {
  mode: "login" | "register";
  onSuccess?: (email: string) => void;
}

export function AuthPages({ mode, onSuccess }: AuthPagesProps) {
  const { t } = useI18n();
  const navigate = useNavigate();
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  const handleSubmit = (e: React.FormEvent) => {
    e.preventDefault();
    if (!email || !password) {
      setError(t("Please fill in all fields"));
      return;
    }
    if (onSuccess) {
      onSuccess(email);
    }
    navigate(mode === "register" ? "/assets" : "/");
  };

  return (
    <main className="flex min-h-[80vh] items-center justify-center px-4 py-12">
      <div className="w-full max-w-md space-y-6">
        <div className="text-center space-y-2">
          <Link to="/" className="inline-flex items-center gap-2 text-2xl font-bold text-brand-text">
            <span className="flex h-10 w-10 items-center justify-center rounded-xl bg-brand-accent text-white font-mono shadow-lg">
              B
            </span>
            <span>BTCBOX</span>
          </Link>
          <p className="text-sm text-brand-text-muted">
            {mode === "register" ? t("Create your secure trading account") : t("Welcome back to crypto trading")}
          </p>
        </div>

        <Card className="border-brand-border bg-brand-surface shadow-xl rounded-2xl">
          <CardHeader className="space-y-1 pb-4">
            <CardTitle className="text-xl font-bold text-brand-text">
              {mode === "register" ? t("Register Account") : t("Sign In")}
            </CardTitle>
          </CardHeader>
          <CardContent>
            <form onSubmit={handleSubmit} className="space-y-4">
              {error && (
                <div className="rounded-lg bg-red-500/10 border border-red-500/20 p-3 text-sm text-red-500">
                  {error}
                </div>
              )}

              <div className="space-y-2">
                <label className="text-xs font-medium text-brand-text-muted">
                  {t("Email Address")}
                </label>
                <div className="relative">
                  <Mail className="absolute left-3 top-3.5 h-4 w-4 text-brand-text-muted" />
                  <input
                    type="email"
                    required
                    placeholder="name@example.com"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className="w-full rounded-xl border border-brand-border bg-brand-background pl-10 pr-4 py-2.5 text-sm text-brand-text focus:outline-none focus:ring-2 focus:ring-brand-accent"
                  />
                </div>
              </div>

              <div className="space-y-2">
                <label className="text-xs font-medium text-brand-text-muted">
                  {t("Password")}
                </label>
                <div className="relative">
                  <Lock className="absolute left-3 top-3.5 h-4 w-4 text-brand-text-muted" />
                  <input
                    type="password"
                    required
                    placeholder="••••••••"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full rounded-xl border border-brand-border bg-brand-background pl-10 pr-4 py-2.5 text-sm text-brand-text focus:outline-none focus:ring-2 focus:ring-brand-accent"
                  />
                </div>
              </div>

              <Button type="submit" className="w-full bg-brand-accent text-white py-3 rounded-xl hover:opacity-90 flex items-center justify-center gap-2 font-medium">
                <span>{mode === "register" ? t("Create Account") : t("Sign In")}</span>
                <ArrowRight className="h-4 w-4" />
              </Button>
            </form>
          </CardContent>
          <CardFooter className="flex justify-center border-t border-brand-border/40 pt-4 pb-4">
            <p className="text-xs text-brand-text-muted">
              {mode === "register" ? (
                <>
                  {t("Already have an account?")}{" "}
                  <Link to="/login" className="text-brand-accent hover:underline font-medium">
                    {t("Sign In")}
                  </Link>
                </>
              ) : (
                <>
                  {t("Don't have an account?")}{" "}
                  <Link to="/register" className="text-brand-accent hover:underline font-medium">
                    {t("Register Now")}
                  </Link>
                </>
              )}
            </p>
          </CardFooter>
        </Card>
      </div>
    </main>
  );
}
