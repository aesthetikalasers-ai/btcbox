name: BTCBOX PostgreSQL schema CI

on:
  pull_request:
    branches: [main, 'fix/post-merge-db-bootstrap-seconds-20261106']
    paths:
      - 'backend/supabase/sql/**'
      - 'backend/scripts/bootstrap-empty-database.sh'
      - 'backend/scripts/test-postgres-schema-bootstrap.sh'
      - 'backend/tests/postgres-financial-lifecycle.integration.sql'
      - '.github/workflows/btcbox-postgres-schema-ci.yml'
  push:
    branches:
      - main
      - integration/btcbox-mainline-consolidation-20261112
      - fix/post-merge-db-bootstrap-seconds-20261106
    paths:
      - 'backend/supabase/sql/**'
      - 'backend/scripts/bootstrap-empty-database.sh'
      - 'backend/scripts/test-postgres-schema-bootstrap.sh'
      - 'backend/tests/postgres-financial-lifecycle.integration.sql'
      - '.github/workflows/btcbox-postgres-schema-ci.yml'

permissions:
  contents: read

jobs:
  empty-postgres-bootstrap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: btcbox-ci-only
          POSTGRES_DB: btcbox_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d btcbox_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply all canonical SQL files to disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:btcbox-ci-only@localhost:5432/btcbox_ci
        run: bash backend/scripts/test-postgres-schema-bootstrap.sh
