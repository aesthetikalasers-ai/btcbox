name: BTCBOX Phase 0 secret scan

on:
  push:
    branches:
      - audit/phase-0-baseline-evidence-20261111
    paths:
      - ".github/workflows/phase-0-secret-scan.yml"
      - "frontend/**"
      - "backend/**"
      - "docs/**"
      - "*.json"
      - "*.yml"
      - "*.yaml"
      - "*.toml"
      - "*.js"
      - "*.ts"
      - "*.tsx"
      - "*.jsx"
      - "*.env*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Full Git history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all refs and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VERSION="8.24.3"
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}" \
            --output "/tmp/${ARCHIVE}"
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
          sha256sum "/tmp/${ARCHIVE}"

      - name: Scan all refs and reachable Git history
        id: scan
        shell: bash
        run: |
          set +e
          mkdir -p phase-0-secret-scan
          gitleaks git . \
            --log-opts="--all" \
            --redact \
            --report-format=json \
            --report-path=phase-0-secret-scan/gitleaks-redacted.json
          code=$?
          echo "GITLEAKS_EXIT_CODE=${code}" | tee phase-0-secret-scan/exit-code.txt
          echo "GITLEAKS_VERSION=$(gitleaks version)" | tee phase-0-secret-scan/version.txt
          echo "SCANNED_REF_SCOPE=all locally fetched refs; full reachable history (fetch-depth: 0)" | tee phase-0-secret-scan/scope.txt
          exit "${code}"

      - name: Upload redacted scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcbox-phase-0-secret-scan
          path: phase-0-secret-scan/
          if-no-files-found: warn
          retention-days: 7
