<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BTCBOX — Secure cryptocurrency exchange. Trade Bitcoin, Ethereum, USDT and more with spot markets, real-time market data and Google authentication.">
<meta name="theme-color" content="#0B0E11">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<title>BTCBOX — Secure Crypto Exchange | Trade BTC, ETH, USDT</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" integrity="sha384-o5uz97et3bErHvpKfD4Jz4n0JfhJDWABFuF4NP+iEEDxE1VwMWJ19QGR0lqFZnr6" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/overlays.css">
<link rel="stylesheet" href="/assets/css/layouts.css">
<link rel="stylesheet" href="/assets/css/views.css">
</head>
<body>
<div id="splash">
  <svg viewBox="0 0 100 100" role="img" aria-label="BTCBOX" class="splash-icon"><g fill="none" stroke="#EAECEF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M82 36 L90 50 L50 90 L10 50 L50 10 L68 24"/></g><polygon points="17,45 50,68 97,25 50,80 21,55" fill="#2E9E6B"/></svg>
  <svg viewBox="0 0 280 100" role="img" aria-label="BTCBOX" style="width:93px;height:22px;object-fit:contain;max-width:70%"><g transform="translate(4,11) scale(0.78)"><g fill="none" stroke="#EAECEF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M82 36 L90 50 L50 90 L10 50 L50 10 L68 24"/></g><polygon points="17,45 50,68 97,25 50,80 21,55" fill="#2E9E6B"/></g><text x="98" y="72" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="52" letter-spacing="-1"><tspan fill="#2E9E6B">BTC</tspan><tspan fill="#EAECEF">BOX</tspan></text></svg>
  <div class="splash-bar"><div></div></div>
</div>

<div id="app" style="display:flex;min-height:100vh">
  <!-- desktop sidebar -->
  <aside id="sidebar" class="sidebar-desk" style="width:224px;flex-shrink:0;background:var(--bg-card);border-right:1px solid var(--border);position:fixed;top:0;bottom:0;left:0;z-index:40;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--border)">
      <svg viewBox="0 0 100 100" role="img" aria-label="BTCBOX" style="width:28px;height:28px;object-fit:contain"><g fill="none" stroke="#EAECEF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M82 36 L90 50 L50 90 L10 50 L50 10 L68 24"/></g><polygon points="17,45 50,68 97,25 50,80 21,55" fill="#2E9E6B"/></svg>
      <span style="font-weight:700;font-size:18px;letter-spacing:.02em"><span style="color:var(--brand-bright)">BTC</span><span style="color:var(--text-primary)">BOX</span></span>
    </div>
    <nav id="side-nav" class="scroll" style="flex:1;overflow-y:auto;padding:12px 8px;display:flex;flex-direction:column;gap:2px"></nav>
    <div style="padding:12px;border-top:1px solid var(--border)">
      <div class="tag" style="background:var(--brand-soft);color:var(--brand-bright);width:100%;justify-content:center">
        <span style="width:6px;height:6px;border-radius:50%;background:var(--brand-bright);display:inline-block;animation:breathe 1.6s infinite"></span>
        LIVE MARKET
      </div>
    </div>
  </aside>

  <div id="main-wrap" style="flex:1;min-width:0;display:flex;flex-direction:column">
    <!-- topbar -->
    <header id="topbar" class="topbar-desk" style="height:56px;flex-shrink:0;background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:30;flex-wrap:nowrap;min-width:0">
      <div style="flex:1;max-width:360px;position:relative">
        <input id="global-search" placeholder="Search markets (e.g. BTC)" style="width:100%;padding:8px 12px 8px 36px;font-size:13px">
        <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted)" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <div id="search-results" style="position:absolute;top:44px;left:0;right:0;background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow-modal);display:none;max-height:320px;overflow:auto;z-index:60"></div>
      </div>
      <div style="flex:1"></div>
      <button id="notif-btn" title="Notifications" style="position:relative;padding:8px;border-radius:6px;color:var(--text-secondary)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span style="position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--down)"></span>
      </button>
      <a href="#/assets" class="btn btn-ghost" style="padding:7px 14px;font-size:13px">Assets</a>
      <div id="topbar-guest-auth" style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <a id="topbar-login" href="#/login" class="btn btn-ghost" style="padding:7px 13px;font-size:13px">Log in</a>
        <a id="topbar-register" href="#/register" class="btn btn-primary" style="padding:7px 13px;font-size:13px">Sign up</a>
      </div>
      <div style="position:relative">
        <button id="avatar-btn" style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--bg-raised);border:1px solid var(--border)">
          <span id="avatar-letter" style="width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">D</span>
          <span id="avatar-email" style="font-size:13px;color:var(--text-secondary)">Guest</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted)"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="avatar-menu" style="display:none;position:absolute;right:0;top:46px;width:200px;background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow-modal);z-index:60;overflow:hidden">
          <a href="#/settings" class="nav-item" style="border-radius:0">Settings</a>
          <a href="#/kyc" class="nav-item" style="border-radius:0">Identity (KYC)</a>
          <a href="#/admin" class="nav-item" style="border-radius:0">Admin Console</a>
          <div style="height:1px;background:var(--border)"></div>
          <button id="logout-btn" class="nav-item" style="width:100%;text-align:left;border-radius:0;color:var(--down)">Log out</button>
        </div>
      </div>
    </header>

    <main id="main-content" class="scroll" style="flex:1;overflow-y:auto;padding:24px"></main>
  </div>
</div>

<!-- mobile bottom nav -->
<nav class="mobile-nav" id="mobile-nav" aria-label="Primary navigation">
  <a class="mob-tab" data-route="home" href="#/home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a class="mob-tab" data-route="markets" href="#/markets"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 5-5"/></svg>Markets</a>
  <a class="mob-tab" data-route="tradehub" href="#/trade-hub"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>Trade</a>
  <a class="mob-tab" data-route="assets" href="#/assets"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>Assets</a>
  <a class="mob-tab" data-route="me" href="#/me"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>My</a>
</nav>

<div id="toast-root"></div>
<div id="modal-root"></div>

<script src="/assets/js/app-core.js"></script>
<script src="/assets/js/ui-components.js"></script>
<script src="/assets/js/views-home.js"></script>
<script src="/assets/js/views-trade.js"></script>
<script src="/assets/js/views-trading.js"></script>
<script src="/assets/js/views-assets.js"></script>
<script src="/assets/js/views-account.js"></script>
<script src="/assets/js/views-missing.js"></script>
<script src="/assets/js/boot.js"></script>
</body>
</html>
